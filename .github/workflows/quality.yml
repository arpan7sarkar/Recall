name: Recall quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: recall
          POSTGRES_PASSWORD: recall
          POSTGRES_DB: recall
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recall -d recall"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
      NEXT_PUBLIC_RENDER_API_URL: https://api.example.invalid/v1
      CLERK_SECRET_KEY: sk_test_ci_placeholder
      DATABASE_URL: postgresql://recall:recall@localhost:5432/recall?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json
      - name: Install API dependencies
        run: npm ci --prefix apps/api
      - name: Install web dependencies
        run: npm ci --prefix apps/web
      - name: Validate Prisma schema
        run: npm run prisma:generate && npm --prefix apps/api exec prisma validate -- --schema prisma/schema.prisma
      - name: Apply and verify Prisma migrations
        run: |
          npm --prefix apps/api exec prisma migrate deploy -- --schema prisma/schema.prisma
          npm --prefix apps/api exec prisma migrate status -- --schema prisma/schema.prisma
          npm --prefix apps/api exec prisma db execute --stdin --schema prisma/schema.prisma < apps/api/prisma/migration_smoke.sql
      - name: Run tests
        run: npm test
      - name: Run runtime tests
        run: npm run test:runtime
      - name: Run lint
        run: npm run lint
      - name: Build API and web
        run: npm run build

  browser:
    runs-on: ubuntu-latest
    needs: quality
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        run: npm ci --prefix apps/web
      - name: Install Chromium
        run: npx --prefix apps/web playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: npm run test:e2e
      - name: Upload browser artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: apps/web/test-results
